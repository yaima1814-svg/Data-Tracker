<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shower Schedule | Portal</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#f4f7fb;
    --panel:#ffffff;
    --ink:#17243a;
    --muted:#68758a;
    --line:#dce4ef;
    --accent:#2864e8;
    --accent-light:#eaf0ff;
    --sidebar:#111c31;
    --sidebar-text:#eaf0fa;
    --shadow:0 8px 24px rgba(25,45,80,.07);
}

body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:var(--sidebar);
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    font-size:16px;
}

nav{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:12px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

nav button{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-weight:bold;
    font-size:15px;
    padding:12px 16px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease,transform .15s ease;
}

nav button:hover{
    background:var(--accent-light);
    color:var(--accent);
    transform:translateY(-1px);
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:3px;
}

.section{
    display:none;
    padding:24px;
    max-width:1500px;
    margin:auto;
}

.section.active{
    display:block;
}

.section-title{
    color:var(--ink);
    font-weight:800;
    font-size:27px;
    border-bottom:2px solid var(--line);
    padding-bottom:12px;
    margin-bottom:22px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    font-size:16px;
}

select,input,textarea{
    font-family:Arial,Helvetica,sans-serif;
}

select{
    min-width:150px;
    min-height:48px;
    padding:10px 12px;
    font-size:16px;
    font-weight:bold;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
}

input,textarea{
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--panel);
    color:var(--ink);
    padding:12px;
    font-size:16px;
}

.action-button{
    min-height:46px;
    padding:10px 18px;
    font-size:15px;
    font-weight:bold;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    border-radius:9px;
    cursor:pointer;
    transition:background .15s ease,transform .15s ease;
}

.action-button:hover{
    background:var(--accent-light);
    transform:translateY(-1px);
}

.blue-button{
    border-color:var(--accent);
    background:var(--accent);
    color:white;
}

.blue-button:hover{
    background:#174fc8;
    color:white;
}

.calendar-wrapper{
    width:100%;
    overflow-x:auto;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(135px,1fr));
    gap:8px;
    min-width:1000px;
}

.day-header{
    background:var(--sidebar);
    color:white;
    text-align:center;
    font-weight:bold;
    padding:14px 8px;
    font-size:14px;
    border-radius:8px;
}

.calendar-day{
    border:1px solid var(--line);
    border-radius:10px;
    min-height:140px;
    padding:10px;
    background:var(--panel);
}

.calendar-day.invalid{
    background:var(--bg);
    border-color:transparent;
}

.day-number{
    font-size:19px;
    font-weight:bold;
    margin-bottom:10px;
}

.calendar-day select{
    width:100%;
    min-width:0;
    min-height:48px;
    font-size:14px;
}

.month-title{
    font-size:22px;
    font-weight:bold;
    text-align:center;
    margin:28px 0 14px;
    padding:14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel);
}

.tracker-table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    background:var(--panel);
    border-radius:10px;
    overflow:hidden;
}

.tracker-table th,
.tracker-table td{
    border:1px solid var(--line);
    padding:12px;
    text-align:center;
}

.tracker-table th{
    background:var(--sidebar);
    color:white;
    font-size:15px;
}

.tracker-table td{
    font-size:15px;
}

.tracker-table select{
    width:100%;
    min-width:160px;
}

.contract{
    border:1px solid var(--line);
    border-radius:14px;
    padding:25px;
    line-height:1.7;
    font-size:16px;
    background:var(--panel);
    box-shadow:var(--shadow);
}

.contract h2{
    text-align:center;
    margin-top:0;
}

.contract h3{
    margin-bottom:5px;
}

.agreed-rule{
    border:1px solid #b8ccff;
    border-left:5px solid var(--accent);
    border-radius:8px;
    padding:16px;
    font-weight:bold;
    font-size:17px;
    margin:16px 0;
    background:var(--accent-light);
}

.paper{
    border:1px solid var(--line);
    border-radius:14px;
    padding:25px;
    min-height:600px;
    background:var(--panel);
    box-shadow:var(--shadow);
}

.paper h2{
    text-align:center;
    margin-top:0;
}

.paper-row{
    margin:18px 0;
}

.paper-row label{
    display:block;
    margin-bottom:8px;
}

.paper-row input,
.paper-row select{
    width:100%;
    max-width:600px;
}

.paper-row textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
}

.saved-item{
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    background:var(--panel);
    box-shadow:var(--shadow);
}

.saved-item h3{
    margin-top:0;
}

.saved-item pre{
    white-space:pre-wrap;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
}

.login-screen{
    position:fixed;
    inset:0;
    background:
        radial-gradient(ellipse at top left,#3159a9 0%,transparent 45%),
        radial-gradient(ellipse at bottom right,#523c96 0%,transparent 45%),
        #101a2e;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:440px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:22px;
    padding:34px;
    text-align:center;
    background:rgba(255,255,255,.97);
    box-shadow:0 25px 80px rgba(0,0,0,.3);
}

.login-box h1{
    margin-top:0;
    font-size:30px;
    letter-spacing:-1px;
}

.login-box p{
    color:var(--muted);
    line-height:1.5;
}

.login-label{
    display:block;
    text-align:left;
    margin-top:24px;
    font-size:12px;
    letter-spacing:1px;
}

.login-box input{
    width:100%;
    height:54px;
    font-size:18px;
    margin:10px 0 14px;
    text-align:center;
    letter-spacing:2px;
}

.login-box button{
    width:100%;
    min-height:52px;
    font-size:16px;
    font-weight:bold;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:white;
    cursor:pointer;
}

.login-box button:hover{
    background:#174fc8;
}

#loginMessage{
    color:#b42318;
    font-weight:bold;
    min-height:25px;
    margin-top:12px;
}

.view-notice{
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:9px;
    padding:14px;
    margin-bottom:20px;
    font-weight:bold;
    background:var(--panel);
}

.saved-month{
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    margin-bottom:20px;
    background:var(--panel);
}

.saved-month h3{
    margin-top:0;
    color:var(--accent);
}

.saved-month-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(120px,1fr));
    gap:6px;
    overflow-x:auto;
}

.saved-month-day{
    border:1px solid var(--line);
    border-radius:7px;
    min-height:100px;
    padding:8px;
    background:var(--panel);
}

.saved-month-day strong{
    display:block;
    margin-bottom:8px;
}

.delete-button{
    margin-top:10px;
    min-height:42px;
    padding:8px 14px;
    font-size:14px;
    font-weight:bold;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
}

.delete-button:hover{
    background:#fff0f0;
    color:#b42318;
}

.points-box{
    border:1px solid var(--line);
    border-radius:14px;
    padding:25px;
    margin-bottom:25px;
    text-align:center;
    background:var(--panel);
    box-shadow:var(--shadow);
}

.points-number{
    font-size:42px;
    font-weight:bold;
    margin-bottom:8px;
}

.points-goal{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.points-progress{
    width:100%;
    max-width:700px;
    height:20px;
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    margin:0 auto 20px;
    background:var(--bg);
}

.points-progress-fill{
    height:100%;
    width:0;
    background:var(--accent);
    transition:width .2s ease;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:16px;
    margin-bottom:20px;
}

.dashboard-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:16px;
}

.dashboard-card h3{
    font-size:12px;
    letter-spacing:1px;
    color:var(--muted);
    margin:0 0 10px;
}

.dashboard-value{
    font-size:clamp(25px,3vw,34px);
    font-weight:900;
    letter-spacing:-1px;
    color:var(--ink);
}

@media(max-width:760px){
    .section{padding:16px 12px}
    .section-title{font-size:23px}
    .dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .dashboard-card{padding:14px}
    .calendar-grid{min-width:950px}
    .controls{align-items:stretch}
    .controls>*{max-width:100%}
}

@media(max-width:430px){
    .dashboard-grid{grid-template-columns:1fr}
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        scroll-behavior:auto!important;
        animation-duration:.01ms!important;
        transition-duration:.01ms!important;
    }
}
</style>
